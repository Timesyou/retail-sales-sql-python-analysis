[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shelfsense"
version = "1.1.0"
description = "A reproducible retail analytics and inventory replenishment engine."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
maintainers = [{ name = "Tarun Babu Bandi" }]
keywords = ["retail", "inventory", "analytics", "forecasting", "abc-xyz", "replenishment"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Spreadsheet",
]
dependencies = []

[project.scripts]
shelfsense = "shelfsense.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shelfsense = ["schema.sql"]
