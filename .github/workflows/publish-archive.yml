name: Validate and publish ShelfSense archive

on:
  push:
    branches:
      - "fix/shelfsense-publisher-*"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out the selected repair branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Test safe archive extractor and validate archive
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/scripts -p 'test_*.py' -v
          python .github/scripts/safe_extract_archive.py \
            ShelfSense-Inventory-Intelligence-v1.1.0.zip \
            "$RUNNER_TEMP/shelf-upload"
          test -f "$RUNNER_TEMP/shelf-upload/shelfsense/pyproject.toml"
          test -d "$RUNNER_TEMP/shelf-upload/shelfsense/src/shelfsense"

      - name: Stage ShelfSense source
        shell: bash
        run: |
          set -euo pipefail
          cp -a "$RUNNER_TEMP/shelf-upload/shelfsense/." .
          rm -f demo-output/shelfsense.sqlite
          python - <<'PY'
          from pathlib import Path
          ignore = Path(".gitignore")
          if ignore.exists():
              lines = [
                  line for line in ignore.read_text(encoding="utf-8").splitlines()
                  if line.strip() != "!demo-output/shelfsense.sqlite"
              ]
              ignore.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Run ShelfSense unit tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Compile Python source and tests
        run: python -m compileall -q src tests

      - name: Run demo and verify generated outputs
        env:
          PYTHONPATH: src
        shell: bash
        run: |
          set -euo pipefail
          python -m shelfsense \
            --sales data/sales.csv \
            --inventory data/inventory.csv \
            --output "$RUNNER_TEMP/shelfsense-check"
          python - <<'PY'
          import json
          import os
          import sqlite3
          from pathlib import Path

          output = Path(os.environ["RUNNER_TEMP"]) / "shelfsense-check"
          required = (
              "dashboard.html",
              "sku_performance.csv",
              "replenishment_plan.csv",
              "summary.json",
              "shelfsense.sqlite",
          )
          missing = [name for name in required if not (output / name).is_file()]
          if missing:
              raise SystemExit(f"Missing demo outputs: {missing}")
          summary = json.loads((output / "summary.json").read_text(encoding="utf-8"))
          if int(summary.get("sku_count", 0)) <= 0 or int(summary.get("transaction_lines", 0)) <= 0:
              raise SystemExit(f"Unexpected empty demo summary: {summary}")
          with sqlite3.connect(output / "shelfsense.sqlite") as connection:
              result = connection.execute("PRAGMA integrity_check").fetchone()[0]
              if result != "ok":
                  raise SystemExit(f"SQLite integrity check failed: {result}")
          print(f"Demo verified: {summary['sku_count']} SKUs, {summary['transaction_lines']} transaction lines")
          PY

      - name: Check repository contents and create pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          bad = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              name = path.name.lower()
              suffix = path.suffix.lower()
              if name == ".env" or name.startswith(".env."):
                  bad.append(str(path))
              if suffix in {".pem", ".key", ".p12", ".pfx", ".sqlite", ".db", ".pyc"}:
                  bad.append(str(path))
              if any(part in {".venv", "venv", "__pycache__"} for part in path.parts):
                  bad.append(str(path))
          if bad:
              raise SystemExit(f"Generated or sensitive files found: {sorted(set(bad))}")
          required = [
              Path(".github/workflows/publish-archive.yml"),
              Path(".github/workflows/tests.yml"),
              Path("README.md"),
              Path("pyproject.toml"),
              Path("src/shelfsense"),
              Path("tests"),
          ]
          missing = [str(path) for path in required if not path.exists()]
          if missing:
              raise SystemExit(f"Expected project files missing: {missing}")
          if not Path("ShelfSense-Inventory-Intelligence-v1.1.0.zip").is_file():
              raise SystemExit("Original source archive must remain in the repository")
          PY
          branch="feature/shelfsense-inventory-intelligence-${GITHUB_RUN_ID}"
          git switch --create "$branch"
          git add --all
          git diff --cached --check
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add tested ShelfSense retail inventory intelligence project"
          git push --set-upstream origin "$branch"
          gh pr create \
            --base main \
            --head "$branch" \
            --title "Add tested ShelfSense inventory intelligence project" \
            --body "## Summary
          - Publish the ShelfSense Python application, synthetic datasets, SQL examples, generated dashboard, and project documentation.
          - Validate the uploaded ZIP before extraction, including CRC, traversal, absolute paths, symlinks, duplicate paths, secrets, and size limits.
          - Run archive-security tests, the application unit tests, Python compilation, and the end-to-end demo with SQLite integrity verification.
          - Preserve the original archive and the publisher workflow so the process is repeatable.

          All data is synthetic. CI results are attached to this pull request."
