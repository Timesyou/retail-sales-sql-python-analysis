name: Publish uploaded ShelfSense archive
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate and extract archive
        run: |
 python -c "from zipfile import ZipFile; from pathlib import PurePosixPath; z=ZipFile('ShelfSense-Inventory-Intelligence-v1.1.0.zip'); assert z.testzip() is None; names=[PurePosixPath(n) for n in z.namelist()]; assert all(not p.is_absolute() and '..' not in p.parts and p.parts and p.parts[0]=='shelfsense' for p in names); assert not any(p.name=='.env' or p.name.startswith('.env.') or p.name.endswith(('.pem','.key','.pyc')) or any(x in {'.git','__pycache__','.venv','venv'} for x in p.parts) for p in ames); z.extractall('/tmp/shelf-upload')"
          cp -a /tmp/shelf-upload/shelfsense/. .
          rm -f demo-output/shelfsense.sqlite
 python -c "from pathlib import Path; p=Path('.gitignore'); s=p.read_text(); p.write_text(s.replace('!demo-output/shelfsense.sqlite\n',''))"
      - name: Run tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v
      - name: Compile source
        run: python -m compileall -q src tests
      - name: Run demo and verify outputs
        env:
          PYTHONPATH: src
        run: |
          python -m shelfsense --sales data/sales.csv --inventory data/inventory.csv --output "$RUNNER_TEMP/shelfsense-check"
          python -c "import json,os,sqlite3; from pathlib import Path; p=Path(os.environ['RUNNER_TEMP'])/'shelfsense-check'; assert all((p/n).is_file() for n in ('dashboard.html','sku_performance.csv','replenishment_plan.csv','summary.json','shelfsense.sqlite')); c=sqlite3.connect(p/'shelfsense.sqlite'); assert c.execute('pragma integrity_check').fetchone()[0]=='ok'; s=json.loads((p/'summary.json').read_text()); assert s['sku_count']==9 and s['transaction_lines']==652; c.close()"
      - name: Create branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          branch="feature/shelfsense-inventory-intelligence-v1.1.0"
          git switch -c "$branch"
          rm -rf src/shelfsense/__pycache__ tests/__pycache__
          rm -f ShelfSense-Inventory-Intelligence-v1.1.0.zip .github/workflows/publish-archive.yml
          python -c "from pathlib import Path; bad=[str(p) for p in Path('.').rglob('*') if p.is_file() and (p.name=='.env' or p.name.startswith('.env.') or p.suffix.lower() in ('.pem','.key','.sqlite','.db','.pyc'))]; print(bad); assert not bad"
          git add --all
          git diff --cached --name-only
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Add ShelfSense retail inventory intelligence project"
          git push --set-upstream origin "$branch"
          gh pr create --base main --head "$branch" --title "Add ShelfSense inventory intelligence project" --body "Adds the ShelfSense retail analytics application, synthetic data, SQL schema and examples, HTML dashboard, methodology documentation, and automated tests. The workflow runs the test suite, compiles source, executes the sample analysis, and verifies the generated SQLite database. Demonstration data is synthetic."
